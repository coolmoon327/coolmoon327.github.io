<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3eedf">
    <meta
      name="description"
      content="把种子逐步合成为论文与花园的 4×4 轻量合成游戏。"
    >
    <title>方块花园</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="game-card" aria-labelledby="game-title">
      <header class="game-header">
        <div>
          <p class="eyebrow">MERGE GARDEN · 4×4</p>
          <h1 id="game-title">方块花园</h1>
          <p class="subtitle">从一粒种子，培育到一篇论文。</p>
        </div>

        <div class="scoreboard" aria-label="本局统计">
          <div>
            <span>分数</span>
            <output id="score">0</output>
          </div>
          <div>
            <span>最高</span>
            <output id="best-score">0</output>
          </div>
        </div>
      </header>

      <p class="status" id="status">点“开始培育”，再用按钮移动所有样本。</p>

      <div class="board-shell">
        <div
          class="board"
          id="board"
          role="grid"
          aria-label="4×4 方块花园"
          aria-rowcount="4"
          aria-colcount="4"
          aria-describedby="status"
        ></div>
      </div>

      <div class="session-controls">
        <button class="primary-control" id="toggle-game" type="button">
          开始培育
        </button>
        <button class="secondary-control" id="restart-game" type="button">
          重置
        </button>
      </div>

      <div class="direction-pad" aria-label="移动方向">
        <button type="button" data-direction="left" aria-label="向左移动">
          <span aria-hidden="true">←</span>
        </button>
        <button type="button" data-direction="up" aria-label="向上移动">
          <span aria-hidden="true">↑</span>
        </button>
        <button type="button" data-direction="down" aria-label="向下移动">
          <span aria-hidden="true">↓</span>
        </button>
        <button type="button" data-direction="right" aria-label="向右移动">
          <span aria-hidden="true">→</span>
        </button>
      </div>

      <p class="help">
        相同样本会合并，且每步只合并一次。开始后可用方向键；Esc 暂停。
      </p>
      <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
