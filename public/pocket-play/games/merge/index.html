<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3eedf" />
    <meta
      name="description"
      content="A compact 4×4 merge game that grows seeds into papers and gardens."
    />
    <title data-en="Merge Garden" data-zh="合成花园">Merge Garden</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-card" aria-labelledby="game-title">
      <header class="game-header">
        <div>
          <p class="eyebrow" data-en="MERGE GARDEN · 4×4" data-zh="合成花园 · 4×4">
            MERGE GARDEN · 4×4
          </p>
          <h1 id="game-title" data-en="Merge Garden" data-zh="合成花园">Merge Garden</h1>
          <p
            class="subtitle"
            data-en="Grow one seed into a paper."
            data-zh="从一粒种子，培育到一篇论文。"
          >
            Grow one seed into a paper.
          </p>
        </div>

        <div
          class="scoreboard"
          aria-label="Game statistics"
          data-aria-en="Game statistics"
          data-aria-zh="本局统计"
        >
          <div>
            <span data-en="Score" data-zh="分数">Score</span>
            <output id="score">0</output>
          </div>
          <div>
            <span data-en="Best" data-zh="最高">Best</span>
            <output id="best-score">0</output>
          </div>
        </div>
      </header>

      <p class="status" id="status">Select “Start growing”, then move every sample.</p>

      <div class="board-shell">
        <div
          class="board"
          id="board"
          role="grid"
          aria-label="4×4 merge garden"
          aria-rowcount="4"
          aria-colcount="4"
          aria-describedby="status"
        ></div>
      </div>

      <div class="session-controls">
        <button class="primary-control" id="toggle-game" type="button">Start growing</button>
        <button class="secondary-control" id="restart-game" type="button">
          <span data-en="Reset" data-zh="重置">Reset</span>
        </button>
      </div>

      <div
        class="direction-pad"
        aria-label="Move direction"
        data-aria-en="Move direction"
        data-aria-zh="移动方向"
      >
        <button
          type="button"
          data-direction="left"
          aria-label="Move left"
          data-aria-en="Move left"
          data-aria-zh="向左移动"
        >
          <span aria-hidden="true">←</span>
        </button>
        <button
          type="button"
          data-direction="up"
          aria-label="Move up"
          data-aria-en="Move up"
          data-aria-zh="向上移动"
        >
          <span aria-hidden="true">↑</span>
        </button>
        <button
          type="button"
          data-direction="down"
          aria-label="Move down"
          data-aria-en="Move down"
          data-aria-zh="向下移动"
        >
          <span aria-hidden="true">↓</span>
        </button>
        <button
          type="button"
          data-direction="right"
          aria-label="Move right"
          data-aria-en="Move right"
          data-aria-zh="向右移动"
        >
          <span aria-hidden="true">→</span>
        </button>
      </div>

      <p
        class="help"
        data-en="Equal samples merge once per move. Arrow keys work after starting; Esc pauses."
        data-zh="相同等级的方块会合并；每个方块在一次移动中最多参与一次合并。开始后可用方向键；按 Esc 暂停。"
      >
        Equal samples merge once per move. Arrow keys work after starting; Esc pauses.
      </p>
      <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>
    </main>

    <script src="../shared/runtime.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
