<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title data-en="Q-Path Lab" data-zh="Q 学习寻路">Q-Path Lab</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game" aria-labelledby="game-title">
      <header class="game-header">
        <div>
          <p class="eyebrow" data-en="TABULAR Q-LEARNING" data-zh="表格型 Q 学习">
            TABULAR Q-LEARNING
          </p>
          <h1 id="game-title" data-en="Q-Path Lab" data-zh="Q 学习寻路">Q-Path Lab</h1>
        </div>
        <p class="training-spec" id="training-spec">
          <span data-en="200 episodes" data-zh="200 回合">200 episodes</span>
          <span data-en="48-step cap" data-zh="每回合最多 48 步">48-step cap</span>
        </p>
      </header>

      <section class="board-section" aria-labelledby="board-title">
        <h2 class="sr-only" id="board-title" data-en="Training world" data-zh="训练环境">
          Training world
        </h2>
        <div class="board" id="board" role="group" aria-describedby="board-help"></div>
        <p
          class="sr-only"
          id="board-help"
          data-en="Only the three targets are interactive. Use Tab to reach them."
          data-zh="棋盘上只有 A、B、C 三个候选目标可选；按 Tab 键可在它们之间切换焦点。"
        >
          Only the three targets are interactive. Use Tab to reach them.
        </p>
      </section>

      <dl class="metrics" aria-label="Evaluation metrics">
        <div>
          <dt data-en="Success rate" data-zh="成功率">Success rate</dt>
          <dd><output id="success-rate">—</output></dd>
        </div>
        <div>
          <dt data-en="Avg return" data-zh="平均回报">Avg return</dt>
          <dd><output id="average-return">—</output></dd>
        </div>
        <div>
          <dt data-en="Path steps" data-zh="路径步数">Path steps</dt>
          <dd><output id="path-steps">—</output></dd>
        </div>
      </dl>

      <button
        class="train-button"
        id="train"
        type="button"
        disabled
        data-en="Choose a target"
        data-zh="请先选择目标"
      >
        Choose a target
      </button>

      <p
        class="status"
        id="status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        data-en="Choose target A, B, or C, then train the route."
        data-zh="选择目标 A、B 或 C，再训练策略。"
      >
        Choose target A, B, or C, then train the route.
      </p>
      <p class="sr-only" id="route-summary" aria-live="polite" aria-atomic="true"></p>
    </main>

    <script src="../shared/runtime.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
