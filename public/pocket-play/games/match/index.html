<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef1e7" />
    <title data-en="Pattern Recall" data-zh="图样记忆">Pattern Recall</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game" aria-labelledby="game-title">
      <header>
        <div>
          <p class="kicker" data-en="PATTERN RECALL" data-zh="图样记忆">PATTERN RECALL</p>
          <h1 id="game-title" data-en="Pattern Recall" data-zh="图样记忆">Pattern Recall</h1>
        </div>
        <button class="reset" id="reset" type="button" data-en="New trial" data-zh="新一轮">
          New trial
        </button>
      </header>

      <div
        class="stats"
        aria-label="Trial status"
        data-aria-en="Trial status"
        data-aria-zh="本轮状态"
      >
        <span><span data-en="Moves" data-zh="步数">Moves</span> <strong id="moves">0</strong></span>
        <span
          ><span data-en="Pairs" data-zh="配对">Pairs</span> <strong id="pairs">0 / 8</strong></span
        >
        <span><span data-en="Best" data-zh="最佳">Best</span> <strong id="best">—</strong></span>
      </div>

      <section class="board" id="board" aria-label="Four by four Pattern Recall board"></section>
      <p class="status" id="status" aria-live="polite">Recover the eight hidden pairs.</p>
    </main>
    <script src="../shared/runtime.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
