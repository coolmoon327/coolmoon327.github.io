<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#132832" />
    <title data-en="Idea Constellation" data-zh="灵感星图">Idea Constellation</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="signature" aria-labelledby="game-title">
      <header>
        <div>
          <p class="eyebrow" data-en="IDEA CONSTELLATION" data-zh="灵感星图">IDEA CONSTELLATION</p>
          <h1 id="game-title" data-en="Idea Constellation" data-zh="灵感星图">
            Idea Constellation
          </h1>
        </div>
        <output
          id="count"
          aria-label="Idea node count"
          data-aria-en="Idea node count"
          data-aria-zh="灵感节点数"
          >0 / 7</output
        >
      </header>

      <button
        class="sky"
        id="sky"
        type="button"
        aria-label="Open the idea constellation canvas"
        data-aria-en="Open the idea constellation canvas"
        data-aria-zh="打开灵感星图画布"
        aria-describedby="controls message"
      >
        <svg class="threads" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g id="lines"></g>
        </svg>
        <span
          class="sky-prompt"
          id="prompt"
          data-en="Click / Enter to open a blank map"
          data-zh="点击或按 Enter，打开空白星图"
          >Click / Enter to open a blank map</span
        >
      </button>

      <span
        class="sr-only"
        id="controls"
        data-en="Click the map with a mouse or touch, or focus the canvas and press Enter or Space."
        data-zh="使用鼠标或触屏点击星图，或聚焦画布后按 Enter 或空格。"
      >
        Click the map with a mouse or touch, or focus the canvas and press Enter or Space.
      </span>
      <output
        class="message"
        id="message"
        aria-live="polite"
        data-en="Open a blank map, then place seven idea nodes."
        data-zh="先打开空白星图，再点下七个灵感节点。"
      >
        Open a blank map, then place seven idea nodes.
      </output>
    </main>

    <script src="../shared/runtime.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
