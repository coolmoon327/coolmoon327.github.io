<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#132832">
    <title>星屑签名</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="signature" aria-labelledby="game-title">
      <header>
        <div>
          <p class="eyebrow">STARDUST NOTE</p>
          <h1 id="game-title">星屑签名</h1>
        </div>
        <output id="count" aria-label="星点数量">0 / 7</output>
      </header>

      <button
        class="sky"
        id="sky"
        type="button"
        aria-label="唤醒星屑签名画布"
        aria-describedby="controls message"
      >
        <svg class="threads" viewBox="0 0 100 100" aria-hidden="true">
          <g id="lines"></g>
        </svg>
        <span class="sky-prompt" id="prompt">点一下 / Enter，唤醒夜色</span>
      </button>

      <span class="sr-only" id="controls">
        使用鼠标或触屏点击夜空，或聚焦画布后按 Enter 或空格。
      </span>
      <output class="message" id="message" aria-live="polite">
        先轻轻点一下，让夜色醒来。
      </output>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
