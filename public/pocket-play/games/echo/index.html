<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17182a">
    <meta
      name="description"
      content="记住四个按钮亮起的顺序，再用点击、触屏或键盘 1–4 复现。"
    >
    <title>记忆回声</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="echo-card" aria-labelledby="game-title">
      <header class="card-header">
        <div>
          <p class="eyebrow">MEMORY ECHO</p>
          <h1 id="game-title">记忆回声</h1>
        </div>
        <p class="round-meter" aria-label="当前轮数">
          <span id="round">0</span><small>/ 10</small>
        </p>
      </header>

      <p class="intro">
        先看四格依次亮起，再把越来越长的顺序完整复现。
      </p>

      <section
        class="echo-grid"
        id="echo-grid"
        role="group"
        aria-label="四个回声按钮"
        aria-describedby="instructions"
      >
        <button
          class="echo-pad pad-coral"
          type="button"
          data-pad="0"
          aria-label="珊瑚回声，按键 1"
          aria-keyshortcuts="1"
          disabled
        >
          <span class="pad-number" aria-hidden="true">1</span>
          <span aria-hidden="true">珊瑚</span>
        </button>
        <button
          class="echo-pad pad-gold"
          type="button"
          data-pad="1"
          aria-label="金色回声，按键 2"
          aria-keyshortcuts="2"
          disabled
        >
          <span class="pad-number" aria-hidden="true">2</span>
          <span aria-hidden="true">金色</span>
        </button>
        <button
          class="echo-pad pad-mint"
          type="button"
          data-pad="2"
          aria-label="薄荷回声，按键 3"
          aria-keyshortcuts="3"
          disabled
        >
          <span class="pad-number" aria-hidden="true">3</span>
          <span aria-hidden="true">薄荷</span>
        </button>
        <button
          class="echo-pad pad-blue"
          type="button"
          data-pad="3"
          aria-label="蓝色回声，按键 4"
          aria-keyshortcuts="4"
          disabled
        >
          <span class="pad-number" aria-hidden="true">4</span>
          <span aria-hidden="true">蓝色</span>
        </button>
      </section>

      <div class="feedback">
        <div class="progress-track" aria-hidden="true">
          <span id="progress"></span>
        </div>
        <p id="status" role="status" aria-live="polite" aria-atomic="true">
          等待开始
        </p>
      </div>

      <div class="controls">
        <button class="action" id="action" type="button">开始游戏</button>
        <button
          class="assist"
          id="assist"
          type="button"
          aria-pressed="false"
          aria-label="辅助播报关闭"
        >辅助播报</button>
      </div>
      <p class="instructions" id="instructions">
        点击色块，或使用键盘数字 1–4。游戏进行中可随时重新开始。
      </p>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
