<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef1e7">
    <title>翻牌花园</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="game" aria-labelledby="game-title">
      <header>
        <div>
          <p class="kicker">MEMORY GARDEN</p>
          <h1 id="game-title">翻牌花园</h1>
        </div>
        <button class="reset" id="reset" type="button">重新播种</button>
      </header>

      <div class="stats" aria-label="本局状态">
        <span>步数 <strong id="moves">0</strong></span>
        <span>花圃 <strong id="pairs">0 / 8</strong></span>
        <span>最佳 <strong id="best">—</strong></span>
      </div>

      <section class="board" id="board" aria-label="四乘四翻牌棋盘"></section>
      <p class="status" id="status" aria-live="polite">找出八对藏在叶片下的图案。</p>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
